<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="Illustration of the identify window: a registered person in a green box labelled with their name, and a stranger in a red box labelled Unknown">
  <defs>
    <clipPath id="screen"><rect x="0" y="0" width="1200" height="560" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#screen)">
    <rect width="1200" height="560" fill="#161B22"/>
    <!-- window bar -->
    <rect width="1200" height="44" fill="#21262D"/>
    <circle cx="26" cy="22" r="7" fill="#F85149"/>
    <circle cx="50" cy="22" r="7" fill="#D29922"/>
    <circle cx="74" cy="22" r="7" fill="#3FB950"/>
    <text x="600" y="28" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#8B949E">U-REC — identify</text>
    <!-- status strip -->
    <rect y="44" width="1200" height="40" fill="#0D1117" opacity="0.85"/>
    <text x="24" y="70" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#C9D1D9">U-REC  |  insightface  |  2 registered  |  9.8 fps</text>
    <!-- floor line -->
    <rect y="500" width="1200" height="60" fill="#0D1117" opacity="0.5"/>

    <!-- known person -->
    <g fill="#484F58">
      <circle cx="380" cy="215" r="58"/>
      <path d="M262 493 C262 360 300 300 380 300 C460 300 498 360 498 493 Z"/>
    </g>
    <rect x="240" y="140" width="280" height="356" fill="none" stroke="#3FB950" stroke-width="5" rx="2"/>
    <rect x="238" y="104" width="184" height="38" fill="#3FB950"/>
    <text x="252" y="130" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#0D1117">Joenish 0.68</text>

    <!-- unknown person -->
    <g fill="#30363D">
      <circle cx="820" cy="235" r="52"/>
      <path d="M714 493 C714 372 748 316 820 316 C892 316 926 372 926 493 Z"/>
    </g>
    <rect x="694" y="166" width="252" height="330" fill="none" stroke="#F85149" stroke-width="5" rx="2"/>
    <rect x="692" y="130" width="130" height="38" fill="#F85149"/>
    <text x="706" y="156" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#FFFFFF">Unknown</text>

    <text x="1176" y="540" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#6E7681">q / Esc: quit</text>
  </g>
</svg>
